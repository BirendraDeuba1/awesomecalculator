# SonarQube Cloud configuration for awesomecalculator
sonar.projectKey=BirendraDeuba1_awesomecalculator
sonar.organization=birendradeuba1
sonar.projectName=awesomecalculator

# Analysis scope: the calculator package is production code, src/tests holds the unit tests
sonar.sources=src/calculator
sonar.tests=src/tests
sonar.sourceEncoding=UTF-8

# Python version used in CI, and the coverage report written by coverage.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/coverage.xml

# setup.py is packaging metadata, not application logic, so it is excluded from coverage
sonar.coverage.exclusions=src/setup.py