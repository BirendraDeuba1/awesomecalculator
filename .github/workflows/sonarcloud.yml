name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so SonarQube Cloud can tell new code from old

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked test tools (wheels only, hashes checked)
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Run unit tests with coverage
        working-directory: src
        run: |
          coverage run --source=calculator -m unittest -v
          coverage report -m
          coverage xml -o coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}